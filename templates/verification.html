<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/static/img/logo.png" type="image/x-icon">
        <link rel="stylesheet" href="/static/css/verification.css"/>
        <title>Verify Your Email - ScheduleFlow</title>
    </head>
    <body>
        <main class="verification-container">

            <div class="logo">
                <h1>ScheduleFlow</h1>
            </div>

            <div class="content">

                <h2>Verify your email</h2>

                <p>
                    We've sent a six-digit verification code to your email address.
                    Enter the code below to activate your account.
                </p>

                <form
                    hx-post="/specialists/verify-email"
                    hx-target="#verification-result"
                    hx-swap="innerHTML"
                >
                    <input
                        type="text"
                        name="verification_code"
                        class="code-input"
                        placeholder="000000"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >

                    <button type="submit" class="verify-button">
                        <span id="signup-spinner" class="htmx-indicator">
                            <i class="bi bi-arrow-repeat spinner-icon"></i>
                        </span>
                        Verify Email
                    </button>
                </form>

                <div id="verification-result" hx-on:htmx:after-swap="setTimeout(() => this.innerHTML = '', 4000)">
                </div>

                <p class="expiration">
                    Your verification code expires in 15 minutes.
                </p>

                <div class="resend">
                    <p>
                        Didn't receive the email?
                        <button
                            type="button"
                             x-data="{ disabled: false }"
                            :disabled="disabled"
                            @click="disabled = true; setTimeout(() => disabled = false, 5000)"

                            hx-post="/specialists/resend-verification"
                            hx-target="#verification-result"
                            hx-swap="innerHTML"
                        >
                            Resend code
                        </button>
                    </p>
                </div>

            </div>
        </main>

         <!-- HTMX import-->
        <script src="/static/js/htmx.min.js"></script>
        <script>
            htmx.config.responseHandling = [
                { code: "...", swap: true }
            ];
        </script>

        <!-- Alpine Plugins -->
        <script defer src="/static/js/alpine.min.persist.js"></script>
        <script defer src="/static/js/alpine.min.js"></script>
    </body>
</html>
