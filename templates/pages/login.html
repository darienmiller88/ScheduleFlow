{{ define "title" }}Login{{ end }}

{{ define "css" }}
    <link rel="stylesheet" href="/static/css/login.css"/>
{{ end }}

{{ define "content" }}
    <div class="page-wrapper">

        <div class="form-wrapper" x-data="{ activeTab: 'signIn' }">
            <div class="sign-up-wrapper">
                <button :class="{ 'active': activeTab === 'signIn' }" @click="activeTab = 'signIn'" type="button">
                    Sign In
                    <span class="underline"></span>
                </button>
                
                <button :class="{ 'active': activeTab === 'signUp' }" @click="activeTab = 'signUp'" type="button">
                    Sign Up
                    <span class="underline"></span>
                </button>
            </div>
            
            <!-- Sign In Credentials -->
            <form class="credentials" x-show="activeTab === 'signIn'">
                <div class="form-group">
                    <label for="email">Email Address</label><br/>
                    <input type="email" id="email" name="email" placeholder="you@ucpnyc.org" required>
                </div>
    
                <div class="form-group">
                    <label for="password">Password</label><br/>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
    
                <div class="forgot-password">
                    <a>Forgot password?</a>
                </div>
    
                <button type="submit" class="sign-in-btn">Sign In</button>
                <div class="form-divider">or</div>
                <button type="submit" class="microsoft-btn">
                    <img src="/static/img/microsoft-logo.png" alt="Microsoft Logo" class="microsoft-logo">
                    Sign in with Microsoft
                </button>
            </form>
    
            <!-- Sign Up Credentials -->
            <form class="credentials" x-show="activeTab === 'signUp'" hx-post="/specialists/signup" hx-on:htmx:after-request="if(event.detail.successful) this.reset()"> 
                <div class="form-group">
                    <label for="first-name">First Name</label><br/>
                    <input type="text" minlength="2" maxlength="30" id="first-name" name="first-name" placeholder="Enter your first name" required>
                </div>
    
                <div class="form-group">
                    <label for="last-name">Last Name</label><br/>
                    <input type="text" minlength="2" maxlength="30" id="last-name" name="last-name" placeholder="Enter your last name" required>
                </div>
    
                <div class="form-group">
                    <label for="email">Email Address</label><br/>
                    <input 
                        type="email"
                        id="email"
                        name="email" 
                        placeholder="you@ucpnyc.org" 
                        pattern="[a-zA-Z0-9._%+\-]+@ucpnyc\.org$" 
                        title="Please use a @ucpnyc.org email address"
                        required
                    >
                </div>
    
                <div class="form-group">
                    <label for="password">Password</label><br/>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
    
                <button type="submit" class="sign-in-btn">Sign Up</button>
            </form>
    
            <!-- Question to sign up if don't have an account -->
            <div class="form-footer" x-show="activeTab === 'signIn'">
                Don't have an account? <span @click="activeTab = 'signUp'">Sign up</span>
            </div>
            
            <!-- Question to sign in if already have an account -->
            <div class="form-footer" x-show="activeTab === 'signUp'">
                Already have an account? <span @click="activeTab = 'signIn'">Sign in</span>
            </div>
    
        </div>
    </div>
{{ end }}
