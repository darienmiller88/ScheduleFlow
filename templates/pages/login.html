{{ define "title" }}Login{{ end }}

{{ define "css" }}
    <link rel="stylesheet" href="/static/css/login.css"/>
{{ end }}

{{ define "content" }}
    <div class="page-wrapper">

        <div class="form-wrapper" x-data="{ activeTab: 'signIn' }">
            <div class="sign-up-wrapper">
                <button :class="{ 'active': activeTab === 'signIn' }" @click="activeTab = 'signIn'" type="button">
                    Sign In
                    <span class="underline"></span>
                </button>
                
                <button :class="{ 'active': activeTab === 'signUp' }" @click="activeTab = 'signUp'" type="button">
                    Sign Up
                    <span class="underline"></span>
                </button>
            </div>
            
            <!-- Sign In Credentials -->
            <form class="credentials" x-show="activeTab === 'signIn'" x-data="{ showPassword: false }">
                <div class="form-group">
                    <label for="email">Email Address</label><br/>
                    <input type="email" id="email" name="email" placeholder="you@ucpnyc.org" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label><br/>
                    <div class="password-wrapper">
                        <input 
                            :type="showPassword ? 'text' : 'password'" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            @click="showPassword = !showPassword"
                            :aria-label="showPassword ? 'Hide password' : 'Show password'"
                        >
                            <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        Keep me signed in
                    </label>

                    <div class="forgot-password">
                        <a>Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="sign-in-btn">Sign In</button>
            </form>

            <!-- Sign Up Credentials -->
            <form 
                class="credentials" 
                x-show="activeTab === 'signUp'" 
                x-data="{
                    password: '',
                    showPassword: false,
                    get hasLength() { return this.password.length >= 8 },
                    get hasUpper() { return /[A-Z]/.test(this.password) },
                    get hasLower() { return /[a-z]/.test(this.password) },
                    get hasNumber() { return /[0-9]/.test(this.password) },
                    get hasSymbol() { return /[!@#$%^&*]/.test(this.password) },
                    get passwordValid() {
                        return this.hasLength && this.hasUpper && this.hasLower && this.hasNumber && this.hasSymbol
                    }
                }"
                hx-post="/specialists/signup" 
                hx-on:htmx:after-request="if(event.detail.successful) this.reset()"
                @submit="if (!passwordValid) { $event.preventDefault(); $event.stopImmediatePropagation(); }"
            > 
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label><br/>
                        <input type="text" minlength="2" maxlength="30" id="first-name" name="first-name" placeholder="First name" required>
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last Name</label><br/>
                        <input type="text" minlength="2" maxlength="30" id="last-name" name="last-name" placeholder="Last name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="signup-email">Email Address</label><br/>
                        <input 
                            type="email"
                            id="signup-email"
                            name="email" 
                            placeholder="you@ucpnyc.org" 
                            pattern="[a-zA-Z0-9._%+\-]+@ucpnyc\.org$" 
                            title="Please use a @ucpnyc.org email address"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label><br/>
                        <div class="password-wrapper">
                            <input 
                                :type="showPassword ? 'text' : 'password'" 
                                id="signup-password" 
                                name="password" 
                                minlength="8"
                                placeholder="Enter your password" 
                                x-model="password"
                                required
                            >
                            <button 
                                type="button" 
                                class="password-toggle" 
                                @click="showPassword = !showPassword"
                                :aria-label="showPassword ? 'Hide password' : 'Show password'"
                            >
                                <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <ul class="password-requirements" x-show="password.length > 0" x-cloak>
                    <li :class="hasLength ? 'valid' : 'invalid'"><span class="indicator-dot"></span>At least 8 characters</li>
                    <li :class="hasUpper ? 'valid' : 'invalid'"><span class="indicator-dot"></span>One uppercase letter</li>
                    <li :class="hasLower ? 'valid' : 'invalid'"><span class="indicator-dot"></span>One lowercase letter</li>
                    <li :class="hasNumber ? 'valid' : 'invalid'"><span class="indicator-dot"></span>One number</li>
                    <li :class="hasSymbol ? 'valid' : 'invalid'"><span class="indicator-dot"></span>One symbol</li>
                </ul>

                <button type="submit" class="sign-in-btn" :disabled="!passwordValid" :class="{ 'btn-disabled': !passwordValid }">Sign Up</button>
            </form>

            <!-- Question to sign up if don't have an account -->
            <div class="form-footer" x-show="activeTab === 'signIn'">
                Don't have an account? <span @click="activeTab = 'signUp'">Sign up</span>
            </div>
            
            <!-- Question to sign in if already have an account -->
            <div class="form-footer" x-show="activeTab === 'signUp'">
                Already have an account? <span @click="activeTab = 'signIn'">Sign in</span>
            </div>

        </div>
    </div>
{{ end }}
